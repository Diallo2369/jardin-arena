name: Essai complet (sans publication)

on:
  push:
    branches: [climat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache des données publiques
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Télécharger les relevés, les communes et les altitudes
        run: node scripts/climat/fetch.mjs
      - name: Calculer le climat des communes
        run: node scripts/climat/prepare.mjs
      - name: Construire le site
        run: npm run build
      - name: Taille du site
        run: |
          echo "Pages : $(find dist -name index.html | wc -l)"
          echo "Fichiers : $(find dist -type f | wc -l)"
          du -sh --apparent-size dist dist/que-planter dist/quand-planter dist/data dist/plantes
          for p in que-planter/toulouse-31555 que-planter/nice-06088 que-planter/chamonix-mont-blanc-74056 que-planter/toulouse-31555/novembre quand-planter/tomate/toulouse-31555; do echo "$(wc -c < dist/$p/index.html) $p"; done
